; TESMIOINFLATION 1.5.0-reputation2.1
; Place this file beside TESMIOINFLATION.dll in tesmioloader\build\plugins\.
; Values are read when the game starts. Restart the game after changing them.
;
; Formula used by WRSR v1.1.1.9 (random values are sampled once per economy
; update, which the game schedules every five days):
;   F_RUB = 1 + U(inflation_min_percent/100,
;                  rub_inflation_max_percent/100) / cycles_per_year
;   F_USD = 1 + U(inflation_min_percent/100,
;                  usd_inflation_max_percent/100) / cycles_per_year
;   F_noise = 1 + U(market_noise_min, market_noise_max) / cycles_per_year
;   F_resource = 1 + U(resource_market_noise_min,
;                        resource_market_noise_max) / cycles_per_year
;   ordinary price = old price * F_currency * F_noise * (1 + event_factor)
;   resource price = old price * F_currency * F_resource * G_resource
;
; The original data cells used by this formula are shared by many unrelated
; functions. Version 1.4.0 leaves those cells unchanged and redirects only
; the verified reads inside the market-inflation function to private copies.
;
; The current game uses one lower-bound read in the market function for RUB and
; USD. It is exposed as one setting below; the two upper bounds are independent.
;
; The event_factor is calculated by other game logic, not stored as one safe
; standalone float, so this plugin leaves event effects unchanged. Setting
; market_noise_min=0 and market_noise_max=0 removes only the random market-noise
; term; it does not remove currency inflation or event effects.
;
; Resource records use a separate vanilla factor F_resource. The two new
; resource_market_noise_* settings replace only its -4.0 .. +4.0 random
; arguments. They are raw random arguments, not annual percentages. Setting
; both to 0.0 removes this extra resource-only random walk while preserving
; currency inflation and the game's resource supply/demand factor G_resource.
; The new settings do not directly modify ordinary goods, loans, happiness
; or warehouse code. Steel is itself a resource, however, and the vanilla
; loan formula reads the current steel price; a steel-price change can thus
; indirectly affect loan rates through the original game dependency.
;
; Range conventions used below:
;   Code range = accepted by this DLL's validation, not a good gameplay value.
;   Suggested range = a practical tuning interval for this game build.
;   Percent fields use 1.0 = 1 percent. Noise fields are raw random arguments,
;   so noise=0.5 is not 0.005.

; Loan-rate formula found in WRSR v1.1.1.9:
;   A_same  = sum(CurrentAmount + CurrentAmountForPenalty) for this currency
;   A_other = sum(CurrentAmount + CurrentAmountForPenalty) for the other currency
;   P_same  = sum(CurrentAmountForPenalty) for this currency
;   P_other = sum(CurrentAmountForPenalty) for the other currency
;   q       = current steel price in this currency / loan_reference_steel_price
;   debt    = (A_same + loan_other_currency_debt_weight*A_other)
;               / q / loan_balance_debt_scale
;           + (P_same + loan_other_currency_debt_weight*P_other)
;               / q / loan_penalty_debt_scale
;   rate    = (currency_base_percent + debt)
;             * (1 + loan_term_factor*duration_days/loan_days_per_year)
;   penalty_rate = 2 * rate  (the final multiplier is still game code)
;
; Currency type 2 is RUB and uses base 1.8; type 1 is USD and uses base 2.5.
; With no existing debt, the vanilla defaults give approximately:
;   0.5 years: RUB 2.025% (~2.0%), USD 2.8125% (~2.8%)
;   5.0 years: RUB 4.05% (~4.1%), USD 5.625% (~5.6%)

[TESMIOINFLATION]
; Optional adapter for verified Reputation 2.1; absent provider keeps base formulas.
reputation_compat_enabled=1
; 1 = apply the runtime patch, 0 = do not load this plugin.
enabled=1
; Code range: 0 or any non-zero integer (use 0/1).
; Suggested: 1 when using this INI; set 0 only to disable the whole plugin.

; Market-function lower bound of the annual random inflation rate, in percent.
; Vanilla: 1.0. Raising it raises the minimum RUB and USD change. It is now
; copied to private plugin storage, so 0.0 no longer changes unrelated code.
inflation_min_percent=0.0
; Code range: -99.0 .. 1000.0. It must not exceed either currency maximum.
; Suggested: 0.0 .. 1.0 for stable gameplay; -1.0 .. 0.0 for a strict
; 1960-style Soviet administered-price interpretation. This lower bound is
; shared by the two currency draws, so it cannot be set independently.

; RUB annual upper bound, in percent.
; Vanilla: 10.0. Raising it makes RUB prices compound faster on high draws.
rub_inflation_max_percent=4.0
; Code range: -99.0 .. 1000.0, and it must be >= inflation_min_percent.
; Suggested: 0.0 .. 5.0 for normal play; 0.0 .. 0.5 for a 1960-like RUB path.
; With min=-1.0, max=0.0 gives an average currency draw near -0.5 percent.

; USD annual upper bound, in percent.
; Vanilla: 3.0. Raising it makes USD prices compound faster on high draws.
usd_inflation_max_percent=3.0
; Code range: -99.0 .. 1000.0, and it must be >= inflation_min_percent.
; Suggested: 1.0 .. 6.0 for normal play; with min=0.0, max=4.0 gives an
; average draw near 2.0 percent, matching the 1960 NATO proxy used in the
; accompanying analysis. With min=-1.0, max=5.0 gives the same average.

; Private divisor used to spread the sampled annual rate across economy updates.
; Vanilla: 73.0 (approximately 365/5). Lower values increase each update's
; effect; higher values reduce it. The game still schedules its own updates.
cycles_per_year=73.0
; Code range: >0.001 .. 100000.0.
; Suggested: 60.0 .. 90.0 when updates remain about every five days;
; 73.0 is the recommended value. This changes inflation/noise strength only,
; not the game's calendar or update schedule.

; Raw C3DRandom_Float bounds for the market function's noise term.
; Vanilla: -1.5 .. +1.5. These are raw function arguments, not 0.015/0.015.
; Set both to 0.0 to neutralize random market noise only.
market_noise_min=-1.5
market_noise_max=1.5
; Code range: each bound -1000.0 .. 1000.0, with min <= max.
; Suggested: -0.5 .. 0.5 for moderate volatility; 0.0 .. 0.0 removes the
; random noise term; -1.5 .. 1.5 is comparatively volatile. Symmetric noise
; has approximately zero directional effect but still creates price variance.

; Resource-record-only random factor. Vanilla: -4.0 .. +4.0. This is read by
; the resource-price loop after the RUB/USD factor and before the game's own
; resource/supply-demand factor. It applies to both currency price fields of
; valid resource records, including wood, boards, stone, steel and others.
resource_market_noise_min=-2.0
resource_market_noise_max=2.02
; Code range: each bound -1000.0 .. 1000.0, with min <= max and
; resource_market_noise_min > -cycles_per_year so the multiplier stays > 0.
; Suggested values from the current game data and long-run commodity behavior:
;   -0.5 .. 0.5 : recommended mild resource volatility, near-zero extra drift;
;   0.0 .. 0.0  : removes the resource-only random walk, leaving currency
;                 inflation and the game's supply/demand factor;
;   0.0 .. 0.02 : about +1.0%/year additional resource drift with low
;                 volatility;
;   0.0 .. 0.04 : about +2.0%/year additional resource drift; use only when
;                 deliberately adding a second commodity-inflation component;
;   -4.0 .. 4.0 : vanilla-compatible but can create a noticeable downward
;                 geometric drift (the random multiplier is applied repeatedly).
; With the installed RUB 0.0 .. 4.0, USD 0.0 .. 3.0 and cycles=73 settings,
; -0.5 .. 0.5 gives approximate standalone resource-only drift -0.06%/year;
; combined currency+resource drift is about RUB +1.96%/year and USD +1.45%
; before G_resource and other game events. These are estimates, not a fixed
; guarantee, because the game also changes prices through G_resource.

; 1 = replace the loan-rate calculation with the configurable formula below.
; 0 = leave the game's loan-rate function untouched.
loan_rates_enabled=1
; Code range: 0 or any non-zero integer (use 0/1).
; Suggested: 1 when testing custom rates; 0 to restore vanilla loan logic.

; 1 = redirect the loan-formula reads used by the bottom "利率" preview in the
;     Economy & Trade panel to private copies of the INI values below.
; 0 = leave that preview's original constants unchanged.
; This is effective only when loan_rates_enabled=1. No original shared data
; cell is written in either mode.
loan_preview_sync_enabled=1
; Code range: 0 or any non-zero integer (use 0/1).
; Suggested: 1. With it enabled, the preview and newly created loan contract
; use the same base rate, term factor, debt factors and reference price.

; Base annual contract rates, in percent. These are the rates before debt and
; duration pressure. Vanilla: RUB 1.8, USD 2.5.
rub_loan_base_interest_percent=1.5
usd_loan_base_interest_percent=2.0
; Code range: 0.0 .. 1000.0 for each currency.
; Suggested: RUB 1.5 .. 3.0 and USD 2.5 .. 5.0; for the 1960-style
; recommendation use approximately RUB 1.8 and USD 3.0. Increasing a base
; rate raises that currency's loan rate directly and is then also multiplied
; by the term factor.

; Duration premium coefficient. Vanilla: 0.25.
; At 0.25, a five-year term multiplies the debt-adjusted base by 2.25.
; Setting 0.0 makes duration have no effect on the rate.
loan_term_factor=0.20
; Code range: -1000.0 .. 1000.0.
; Suggested: 0.0 .. 0.5; 0.15 .. 0.25 gives a moderate term premium and
; 0.20 is the recommended starting point. Negative values make longer loans
; cheaper and are generally unsuitable for normal gameplay.

; Fraction of the other currency's debt included in the debt-pressure term.
; Vanilla: 0.5. Setting 0.0 makes RUB and USD debt affect their own rates only.
loan_other_currency_debt_weight=0.5
; Code range: -1000.0 .. 1000.0.
; Suggested: 0.0 .. 1.0, normally 0.0 .. 0.5. At 0.5, other-currency debt
; contributes half as much as same-currency debt; values above 1.0 amplify it.

; Reference steel price used to normalize debt pressure. Vanilla: 550.0.
; A larger value makes the same debt add more rate pressure; a smaller value
; makes the steel-price normalization dampen debt pressure more strongly.
loan_reference_steel_price=550.0
; Code range: >0.001 .. 1,000,000,000.0.
; Suggested: 300.0 .. 1000.0, normally 450.0 .. 700.0 around the game's
; observed steel-price scale. It has no effect when debt pressure is zero.

; Debt-pressure divisors. Vanilla: 1,000,000 for overdue/penalty amount and
; 15,000,000 for ordinary outstanding amount. Lower values increase the
; corresponding rate contribution; higher values reduce it.
loan_penalty_debt_scale=1000000.0
loan_balance_debt_scale=15000000.0
; Code range: each scale >0.001; penalty scale <=1,000,000,000,000.0 and
; balance scale <=1,000,000,000,000.0.
; Suggested starting ranges: penalty scale 500,000 .. 5,000,000 and balance
; scale 5,000,000 .. 50,000,000. Because the result depends on actual debt
; amounts, tune these by watching the added percentage points rather than by
; treating the scales as percentages. Smaller scales make rates rise sharply.

; Calendar divisor used only by the loan-rate formula. Vanilla: 365.0.
; This does not change the game's clock or repayment schedule.
loan_days_per_year=365.0
; Code range: >0.001 .. 100000.0.
; Suggested: 360.0 .. 365.25; use 365.0. Increasing it lowers the duration
; premium for the same number of loan days, but does not alter repayment dates.

; Factors not independently configurable in this INI:
;   event_factor remains controlled by the game's event logic.
;   G_resource remains controlled by the game's resource/supply-demand logic.
;   penalty_rate remains 2 * the calculated ordinary rate in the game caller.
;   Inflation settings do not directly change loan base rates. They can affect
;   loan pressure indirectly by changing the current steel price used by the
;   loan formula; resource_market_noise_* has the same natural dependency for
;   steel. The preview synchronization changes only 14 verified
;   RIP-relative operands in the preview function; it does not write shared
;   runtime data cells or modify SOVIET64.exe on disk.
